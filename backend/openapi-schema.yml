          type: string
          maxLength: 255
        cash_deposited_at:
          type: string
          format: date-time
          nullable: true
        payout_reference:
          type: string
          maxLength: 255
        settled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - commission_amount
      - created_at
      - gross_amount
      - id
      - net_payable
      - order
      - order_created_at
      - order_status
      - order_total
      - updated_at
