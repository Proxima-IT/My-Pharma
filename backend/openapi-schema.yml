openapi: 3.0.3
info:
  title: My Pharma API
  version: 1.0.0
  description: Authentication & Core APIs
paths:
  /api/ads/:
    get:
      operationId: ads_list
      summary: List ads
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Ads
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdList'
          description: ''
    post:
      operationId: ads_create
      summary: Create ad (admin)
      tags:
      - Ads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ad'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
  /api/ads/{id}/:
    get:
      operationId: ads_retrieve
      summary: Get an ad
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
    put:
      operationId: ads_update
      summary: Update ad (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ad'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
    patch:
      operationId: ads_partial_update
      summary: Partial update ad (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAd'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
    delete:
      operationId: ads_destroy
      summary: Delete ad (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      responses:
        '204':
          description: No response body
  /api/auth/addresses/:
    get:
      operationId: auth_addresses_list
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAddressList'
          description: ''
    post:
      operationId: auth_addresses_create
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAddress'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
  /api/auth/addresses/{id}/:
    get:
      operationId: auth_addresses_retrieve
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
    put:
      operationId: auth_addresses_update
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAddress'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
    patch:
      operationId: auth_addresses_partial_update
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserAddress'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
    delete:
      operationId: auth_addresses_destroy
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/auth/addresses/districts/:
    get:
      operationId: auth_addresses_districts_retrieve
      description: Return list of Bangladesh districts for delivery area dropdown.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
  /api/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - DOCTOR
          - GUEST_USER
          - PHARMACY_ADMIN
          - REGISTERED_USER
          - SUPER_ADMIN
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `PHARMACY_ADMIN` - Pharmacy Admin
          * `DOCTOR` - Doctor
          * `REGISTERED_USER` - Registered User
          * `GUEST_USER` - Guest User
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - LOCKED
          - PENDING_VERIFICATION
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
          * `LOCKED` - Locked
          * `PENDING_VERIFICATION` - Pending Verification
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserManagementList'
          description: ''
    post:
      operationId: auth_admin_users_create
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserManagement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserManagement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserManagement'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagement'
          description: ''
  /api/auth/admin/users/{id}/:
    get:
      operationId: auth_admin_users_retrieve
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagement'
          description: ''
    put:
      operationId: auth_admin_users_update
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserManagement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserManagement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserManagement'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagement'
          description: ''
    patch:
      operationId: auth_admin_users_partial_update
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserManagement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserManagement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserManagement'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagement'
          description: ''
    delete:
      operationId: auth_admin_users_destroy
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/auth/admin/users/export-csv/:
    get:
      operationId: auth_admin_users_export_csv_retrieve
      description: Export all non-deleted users to a CSV file. Restricted to SUPER_ADMIN.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagement'
          description: ''
  /api/auth/change-email/confirm/:
    post:
      operationId: auth_change_email_confirm_create
      description: 'POST /api/auth/change-email/confirm/ – Verify OTP and update user
        email (body: new_email, otp).'
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/change-email/request/:
    post:
      operationId: auth_change_email_request_create
      description: POST /api/auth/change-email/request/ – Send OTP to new email; user
        must then confirm with change-email/confirm/.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/change-phone/confirm/:
    post:
      operationId: auth_change_phone_confirm_create
      description: 'POST /api/auth/change-phone/confirm/ – Verify OTP and update user
        phone (body: new_phone, otp).'
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/change-phone/request/:
    post:
      operationId: auth_change_phone_request_create
      description: POST /api/auth/change-phone/request/ – Send OTP to new phone; user
        must then confirm with change-phone/confirm/.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: POST /api/auth/google/ - Sign up or sign in with Google via Firebase
        ID token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation or provider/email mismatch.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid/expired Firebase token.
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Account is temporarily locked.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Firebase is not configured on server.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/auth/login/ – Login with email or phone + password. Returns
        JWT + user.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/auth/logout/ – Blacklist refresh token and optional access
        token.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET /api/auth/me/ – Current user profile. PUT/PATCH – Update profile.
        Add/change email or phone via OTP (send email/phone → OTP sent; send same
        + otp → verified and saved).
      tags:
      - auth
      responses:
        '200':
          description: No response body
    put:
      operationId: auth_me_update
      description: Full or partial update of profile; only provided fields are updated.
        Email/phone require OTP.
      tags:
      - auth
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_me_partial_update
      description: Partial update of profile; only provided fields are updated. Email/phone
        require OTP.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: POST /api/auth/password-reset/ – Request password reset; sends
        reset link to registered email.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: POST /api/auth/password-reset/confirm/ – Reset password using reset
        token sent over email.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirm'
          description: ''
  /api/auth/register/complete/:
    post:
      operationId: auth_register_complete_create
      description: 'POST /api/auth/register/complete/ – Complete registration: username,
        password, email or phone (other than verified), profile_picture, address.
        Accepts JSON or multipart/form-data.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/register/email/:
    post:
      operationId: auth_register_email_create
      description: POST /api/auth/register/email/ – Register with email and password.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/register/phone/:
    post:
      operationId: auth_register_phone_create
      description: POST /api/auth/register/phone/ – Request OTP for phone registration.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/request-otp/:
    post:
      operationId: auth_request_otp_create
      description: POST /api/auth/request-otp/ – Request OTP by email or phone (unified).
        Sends OTP to SMS or email.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: POST /api/auth/token/refresh/ – Rotate refresh token; returns new
        access + refresh + user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: POST /api/auth/verify-otp/ – Verify OTP by email or phone; returns
        registration_token and verified identifier for completion form.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/b2b/commissions/:
    get:
      operationId: b2b_commissions_list
      summary: List B2B commission entries (admin)
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING
          - SETTLED
        description: |-
          * `PENDING` - Pending
          * `SETTLED` - Settled
      tags:
      - B2B
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedB2BCommissionEntryList'
          description: ''
  /api/b2b/commissions/{id}/:
    get:
      operationId: b2b_commissions_retrieve
      summary: Get a B2B commission entry (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this b2b commission entry.
        required: true
      tags:
      - B2B
      responses:
