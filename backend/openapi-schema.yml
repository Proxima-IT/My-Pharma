          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
          description: Commission rate as fraction (e.g. 0.0500 = 5%).
        commission_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        gross_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Order total amount used for settlement.
        net_payable:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: gross_amount - commission_amount
        status:
          $ref: '#/components/schemas/OrderSettlementStatusEnum'
        cash_collected_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
