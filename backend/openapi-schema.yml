  /api/auth/addresses/districts/:
    get:
      operationId: auth_addresses_districts_retrieve
      description: Return list of Bangladesh districts for delivery area dropdown.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
  /api/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - DOCTOR
          - GUEST_USER
          - PHARMACY_ADMIN
          - REGISTERED_USER
          - SUPER_ADMIN
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `PHARMACY_ADMIN` - Pharmacy Admin
          * `DOCTOR` - Doctor
          * `REGISTERED_USER` - Registered User
          * `GUEST_USER` - Guest User
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - LOCKED
          - PENDING_VERIFICATION
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
          * `LOCKED` - Locked
          * `PENDING_VERIFICATION` - Pending Verification
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserManagementList'
          description: ''
    post:
      operationId: auth_admin_users_create
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserManagement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserManagement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserManagement'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagement'
          description: ''
  /api/auth/admin/users/{id}/:
    get:
      operationId: auth_admin_users_retrieve
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagement'
          description: ''
    put:
      operationId: auth_admin_users_update
      description: Manage All Users – SUPER_ADMIN only. List, create, retrieve, update,
        delete users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
