components:
  schemas:
    Ad:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
        image_url:
          type: string
          readOnly: true
        link:
          type: string
          format: uri
          description: Destination URL when ad is clicked.
          maxLength: 500
        order:
          type: integer
          maximum: 65535
          minimum: 0
          description: Display order; lower first.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
      - image_url
      - updated_at
    AddToCart:
      type: object
      properties:
        product:
          type: integer
          nullable: true
        combo:
          type: integer
          nullable: true
        quantity:
          type: integer
          minimum: 1
        dosage:
          type: string
          maxLength: 50
      required:
      - quantity
    AddressTypeEnum:
      enum:
      - HOME
      - OFFICE
      - HOMETOWN
      type: string
      description: |-
        * `HOME` - Home
        * `OFFICE` - Office
        * `HOMETOWN` - Hometown
    AdminBroadcastNotification:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 2000
        target_url:
          type: string
          format: uri
        send_to_opted_in_only:
          type: boolean
          default: false
          description: When true, send only to users who enabled notification permission.
        audience_mode:
          allOf:
          - $ref: '#/components/schemas/AudienceModeEnum'
          default: ALL_ACTIVE
        user_ids:
          type: array
          items:
            type: integer
            minimum: 1
        role_filter:
          type: string
          maxLength: 32
      required:
      - message
      - title
