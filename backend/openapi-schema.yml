    OrderSettlement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        order_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        order_status:
          type: string
          readOnly: true
        order_created_at:
          type: string
          format: date-time
          readOnly: true
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
