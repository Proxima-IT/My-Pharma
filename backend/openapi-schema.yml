      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          description: Identifier for where the logo is used (e.g. 'header', 'footer').
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        image:
          type: string
          format: uri
        image_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
      - image_url
      - slug
      - updated_at
    AudienceModeEnum:
      enum:
      - ALL_ACTIVE
      - OPTED_IN_ONLY
      - USER_IDS
      - ROLE_BASED
      type: string
      description: |-
        * `ALL_ACTIVE` - All active users
        * `OPTED_IN_ONLY` - Opted-in users only
        * `USER_IDS` - Specific user ids
        * `ROLE_BASED` - Role-based segment
