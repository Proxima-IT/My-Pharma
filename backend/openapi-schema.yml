openapi: 3.0.3
info:
  title: My Pharma API
  version: 1.0.0
  description: Authentication & Core APIs
paths:
  /api/ads/:
    get:
      operationId: ads_list
      summary: List ads
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Ads
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdList'
          description: ''
    post:
      operationId: ads_create
      summary: Create ad (admin)
      tags:
      - Ads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ad'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
  /api/ads/{id}/:
    get:
      operationId: ads_retrieve
      summary: Get an ad
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
    put:
      operationId: ads_update
      summary: Update ad (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ad'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
    patch:
      operationId: ads_partial_update
      summary: Partial update ad (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAd'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
          description: ''
    delete:
      operationId: ads_destroy
      summary: Delete ad (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ad.
        required: true
      tags:
      - Ads
      responses:
        '204':
          description: No response body
  /api/auth/addresses/:
    get:
      operationId: auth_addresses_list
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAddressList'
          description: ''
    post:
      operationId: auth_addresses_create
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
        GET    /api/auth/addresses/districts/  – list BD districts for dropdown
        POST   /api/auth/addresses/            – add address
        GET    /api/auth/addresses/<id>/       – get one address
        PUT    /api/auth/addresses/<id>/       – full update
        PATCH  /api/auth/addresses/<id>/       – partial update
        DELETE /api/auth/addresses/<id>/       – delete address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAddress'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddress'
          description: ''
  /api/auth/addresses/{id}/:
    get:
      operationId: auth_addresses_retrieve
      description: |-
        User addresses – authenticated user only.
        Fields: full_name, email, phone, gender, district, thana, address (full address), address_type, is_default.
        GET    /api/auth/addresses/            – list my addresses
