  /api/auth/change-email/confirm/:
    post:
      operationId: auth_change_email_confirm_create
      description: 'POST /api/auth/change-email/confirm/ – Verify OTP and update user
        email (body: new_email, otp).'
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/change-email/request/:
    post:
      operationId: auth_change_email_request_create
      description: POST /api/auth/change-email/request/ – Send OTP to new email; user
        must then confirm with change-email/confirm/.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/change-phone/confirm/:
    post:
      operationId: auth_change_phone_confirm_create
      description: 'POST /api/auth/change-phone/confirm/ – Verify OTP and update user
        phone (body: new_phone, otp).'
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/change-phone/request/:
    post:
      operationId: auth_change_phone_request_create
      description: POST /api/auth/change-phone/request/ – Send OTP to new phone; user
        must then confirm with change-phone/confirm/.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/auth/login/ – Login with email or phone + password. Returns
        JWT + user.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: POST /api/auth/logout/ – Blacklist refresh token and optional access
        token.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET /api/auth/me/ – Current user profile. PUT/PATCH – Update profile.
        Add/change email or phone via OTP (send email/phone → OTP sent; send same
        + otp → verified and saved).
      tags:
      - auth
      responses:
        '200':
          description: No response body
    put:
      operationId: auth_me_update
      description: Full or partial update of profile; only provided fields are updated.
        Email/phone require OTP.
      tags:
      - auth
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_me_partial_update
      description: Partial update of profile; only provided fields are updated. Email/phone
        require OTP.
      tags:
      - auth
      responses:
        '200':
          description: No response body
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: POST /api/auth/password-reset/ – Request password reset; sends
        reset link to registered email.
      tags:
