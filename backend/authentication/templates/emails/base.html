<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Pharma{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      background-color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    table {
      border-collapse: collapse;
      border-spacing: 0;
    }
    td {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    .wrapper {
      width: 100%;
      background-color: #f3f4f6;
      padding: 40px 0;
    }
    .container {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(16, 24, 40, 0.05);
      border: 1px solid #eaecf0;
    }
    .header {
      padding: 32px 40px 24px 40px;
      border-bottom: 1px solid #f2f4f7;
      text-align: center;
    }
    .content {
      padding: 40px;
    }
    .footer {
      background-color: #f9fafb;
      padding: 32px 40px;
      border-top: 1px solid #f2f4f7;
      text-align: center;
      font-size: 13px;
      color: #667085;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #233b8c;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 8px;
      margin-top: 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    .btn:hover {
      background-color: #1a2c6b;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #101828;
      margin-top: 0;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #475467;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .highlight-box {
      background-color: #f8f9fc;
      border: 1px solid #e9ebf4;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin: 24px 0;
    }
    .code {
      font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #233b8c;
      margin: 0;
    }
    .divider {
      border-top: 1px solid #eaecf0;
      margin: 24px 0;
    }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <a href="{{ site_url }}" target="_blank" style="display: inline-block; text-decoration: none;">
          <img src="cid:logo" alt="My Pharma" height="38" style="display: block; border: 0; outline: none; margin: 0 auto;" />
        </a>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p style="margin-bottom: 8px; font-size: 13px; color: #667085;">
          <strong>My Pharma</strong> &bull; Reliable Healthcare Delivered
        </p>
        <p style="margin-bottom: 16px; font-size: 12px; color: #98a2b3;">
          This is an automated email. Please do not reply directly to this message.
        </p>
        <div style="font-size: 12px; color: #98a2b3;">
          &copy; 2026 My Pharma. All rights reserved.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
