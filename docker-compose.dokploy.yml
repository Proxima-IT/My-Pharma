services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    container_name: mypharma-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DISABLE_DATE_HIERARCHY=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=mypharma
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_REDIS=true
      - SERVE_MEDIA=true
      - FIREBASE_SERVICE_ACCOUNT_FILE=/app/serviceAccountKey.json
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - mypharma_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
        NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY}
    container_name: mypharma-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - BACKEND_URL_INTERNAL=http://backend:8000
    depends_on:
      - backend
    networks:
      - mypharma_network

  gateway:
    image: nginx:1.27-alpine
    container_name: mypharma-gateway
    restart: unless-stopped
    # Removed "profiles: - gateway" so that it starts automatically under Dokploy
    volumes:
      - ./deploy/nginx/mypharma.docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mypharma_network
      - dokploy-network # Attached to Dokploy Traefik network for external routing

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
    container_name: mypharma-celery
    restart: unless-stopped
    env_file: .env
    environment:
      - DISABLE_DATE_HIERARCHY=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=mypharma
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_REDIS=true
      - FIREBASE_SERVICE_ACCOUNT_FILE=/app/serviceAccountKey.json
    command: >
      bash -c "celery -A my_pharma worker -l info"
    depends_on:
      - backend
      - redis
    networks:
      - mypharma_network

  mysql:
    image: mysql:8.0
    container_name: mypharma-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: mypharma
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - mypharma_network

  redis:
    image: redis:7-alpine
    container_name: mypharma-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mypharma_network

volumes:
  backend_media:
  backend_static:
  backend_logs:
  mysql_data:
  redis_data:

networks:
  mypharma_network:
    driver: bridge
  dokploy-network:
    external: true
